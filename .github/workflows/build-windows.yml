name: Build Consolle SPES Ginnastica Mestre Windows

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Installa Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Installa dipendenze
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Esegui test
        shell: pwsh
        run: |
          $env:PYTHONPATH = "app"
          python -m pytest -q

      - name: Crea eseguibile
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm SPES_Tools.spec

      - name: Installa Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Crea installer Windows
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\SPES_Configurator.iss"'

      - name: Pubblica pacchetto portabile
        uses: actions/upload-artifact@v4
        with:
          name: Consolle_SPES_Ginnastica_Mestre_6_0_5_Portable
          path: dist/Consolle_SPES_Ginnastica_Mestre.exe
          if-no-files-found: error

      - name: Pubblica installer
        uses: actions/upload-artifact@v4
        with:
          name: Consolle_SPES_Ginnastica_Mestre_6_0_5_Setup
          path: dist/installer/Consolle_SPES_Ginnastica_Mestre_6.0.5_Setup.exe
          if-no-files-found: error

      - name: Pubblica release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/Consolle_SPES_Ginnastica_Mestre_6.0.5_Setup.exe
          generate_release_notes: true
