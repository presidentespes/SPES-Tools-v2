[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spes-tools"
version = "1.0.0"
description = "Convertitore bancario e strumenti CAF per SPES Mestre Ginnastica"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6>=6.8,<7",
  "pdfplumber>=0.11,<1",
  "reportlab>=4.2,<5",
]

[project.scripts]
spes-tools = "spes_tools.__main__:main"

[tool.setuptools]
package-dir = {"" = "app"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
spes_tools = ["config_abi.json"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
