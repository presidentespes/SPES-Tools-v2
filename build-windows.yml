name: Build SPES Configuratore Contabile Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Installa Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Crea eseguibile
        run: |
          pyinstaller --noconfirm SPES_Tools.spec

      - name: Pubblica eseguibile
        uses: actions/upload-artifact@v4
        with:
          name: SPES_Configuratore_Contabile_4_0
          path: dist/SPES_Configuratore_Contabile.exe
          if-no-files-found: error
